# StudyPilot Gitleaks configuration
#
# Extends the default rule set shipped with Gitleaks 8.30.1 (the version
# pinned in .github/workflows/ci.yml). Allowlist by path only for known
# fake local-development fixtures. Never allowlist a live token regex, a
# PEM private key, a hosted credential, or backend/service-account.json.
#
# A path allowlist trusts the entire file. .env.studypilot-local must remain
# the official Supabase CLI local demo fixture. Do not put hosted keys there.
#
# Never allowlist a historical credential leak by commit. If one is found,
# revoke it and remove the containing path from history.

title = "StudyPilot"

[extend]
useDefault = true

[[allowlists]]
description = "Official Supabase CLI local demo anon JWT for npm run dev:local (not a hosted secret)"
paths = [
  '''(?:^|/)\.env\.studypilot-local$''',
]

[[allowlists]]
description = "Example/template file — contains a PEM comment with placeholder content (\\n...\\n), not a real private key."
paths = [
  '''(?:^|/)supabase/functions/\.env\.local\.example$''',
]

[[allowlists]]
description = "Test fixtures and CI stubs — fake unsigned JWTs and placeholder PEM strings used only in unit/e2e tests and CI environment variables. None of these are valid credentials."
paths = [
  '''(?:^|/)backend/tests/conftest\.py$''',
  '''(?:^|/)backend/tests/test_authz\.py$''',
  '''(?:^|/)e2e/web-golden-flow\.spec\.ts$''',
  '''(?:^|/)src/lib/deploymentConfig\.test\.ts$''',
  '''(?:^|/)src/lib/deploymentConfig\.ts$''',
  '''(?:^|/)\.github/workflows/ci\.yml$''',
  '''(?:^|/)scripts/quality-check\.mjs$''',
  '''(?:^|/)scripts/serve-e2e\.mjs$''',
]

[[allowlists]]
description = "oauth-helper and config tests contain PEM strings with the text 'secret-test-material' as a test fixture, not a real key."
paths = [
  '''(?:^|/)supabase/functions/shared/.*\.test\.ts$''',
  '''(?:^|/)src/lib/.*\.test\.ts$''',
  '''(?:^|/)scripts/validate-local-ai-env\.test\.mjs$''',
]
