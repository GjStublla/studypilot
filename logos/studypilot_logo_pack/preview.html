<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyPilot Logo Pack Preview</title>
  <link rel="stylesheet" href="handoff/studypilot-brand-tokens.css" />
  <style>
    body { margin: 0; background: var(--sp-bg); color: var(--sp-text); font-family: var(--sp-logo-font); }
    main { max-width: 1100px; margin: 0 auto; padding: 56px 24px; }
    h1 { font-size: 44px; letter-spacing: -0.05em; margin: 0 0 8px; }
    p { color: var(--sp-muted); margin: 0 0 36px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .card { border: 1px solid var(--sp-border); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border-radius: 24px; padding: 28px; min-height: 170px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
    .card img { max-width: 100%; height: auto; object-fit: contain; }
    .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--sp-muted); }
  </style>
</head>
<body>
  <main>
    <h1>StudyPilot Logo Pack</h1>
    <p>Website-ready cuts and SVG assets for the AI study assistant brand.</p>
    <div class="grid">
      <div class="card"><span class="label">Full lockup</span><img src="svg/studypilot-full-lockup.svg" /></div>
      <div class="card"><span class="label">Mark</span><img src="svg/studypilot-mark.svg" style="max-height:150px" /></div>
      <div class="card"><span class="label">App icon</span><img src="svg/studypilot-app-icon.svg" style="max-height:180px" /></div>
      <div class="card"><span class="label">Wordmark</span><img src="svg/studypilot-wordmark.svg" /></div>
      <div class="card"><span class="label">Monochrome</span><img src="svg/studypilot-monochrome-lockup.svg" /></div>
    </div>
  </main>
</body>
</html>
