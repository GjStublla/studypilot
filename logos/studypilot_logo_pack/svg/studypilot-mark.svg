<svg width="200" height="180" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StudyPilot mark</title>
  <desc id="desc">AI orb in a browser window over an open book with a pilot arrow.</desc>

  <defs>
    <linearGradient id="orbGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39D7FF"/>
      <stop offset="42%" stop-color="#5C6CFF"/>
      <stop offset="72%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BB8FF"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#F04CFF"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="42%" stop-color="#74D7FF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#875CFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF4FD8" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


  <g id="studypilot-mark" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 72V38c0-9.9 8.1-18 18-18h96c9.9 0 18 8.1 18 18v34" fill="none" stroke="#404657" stroke-width="4"/>
    <path d="M34 48h132" fill="none" stroke="#242A38" stroke-width="3"/>
    <circle cx="52" cy="34" r="4.5" fill="#51596B"/>
    <circle cx="66" cy="34" r="4.5" fill="#51596B" opacity="0.82"/>
    <circle cx="80" cy="34" r="4.5" fill="#51596B" opacity="0.64"/>

    <circle cx="100" cy="92" r="44" fill="url(#orbGradient)" filter="url(#softGlow)"/>
    <circle cx="100" cy="92" r="44" fill="url(#orbGlow)"/>
    <path d="M100 61l19 58-19-13-19 13 19-58z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M100 68v38" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>

    <path d="M100 155c-23-16-49-22-86-22" fill="none" stroke="url(#lineGradient)" stroke-width="4"/>
    <path d="M100 155c23-16 49-22 86-22" fill="none" stroke="url(#lineGradient)" stroke-width="4"/>
    <path d="M100 155c-19-10-43-14-78-14" fill="none" stroke="#8B8CFF" stroke-width="2.8" opacity="0.85"/>
    <path d="M100 155c19-10 43-14 78-14" fill="none" stroke="#F04CFF" stroke-width="2.8" opacity="0.85"/>

    <path d="M100 9l4 11 11 4-11 4-4 11-4-11-11-4 11-4 4-11z" fill="#FFFFFF"/>
    <path d="M100 0v5M100 43v5" stroke="#93C5FD" stroke-width="2" opacity="0.75"/>
  </g>

</svg>