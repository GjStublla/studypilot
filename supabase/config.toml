# StudyPilot Supabase local/project config.
# Keep verify_jwt enabled for every deployed Edge Function.

project_id = "rqszloxxegvxaedptcqj"

[api]
enabled = true

[db]
port = 54322
major_version = 17

[studio]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**"]

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.live-token]
verify_jwt = true

[functions.live-rubric-search]
verify_jwt = true

[functions.live-turn]
verify_jwt = true

[functions.live-finish]
verify_jwt = true

[functions.ensure-file-search-store]
verify_jwt = true

[functions.extract-rubric]
verify_jwt = true

[functions.index-knowledge-document]
verify_jwt = true

[functions.socratic-coach]
verify_jwt = true

[functions.summarize-session]
verify_jwt = true

[functions.delete-knowledge-document]
verify_jwt = true

[functions.delete-user-data]
verify_jwt = true

[analytics]
enabled = false

[functions.debug-config]
enabled = true
verify_jwt = false
import_map = "./functions/debug-config/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/debug-config/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/debug-config/*.html" ]

[functions.show-config]
enabled = true
verify_jwt = false
import_map = "./functions/show-config/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/show-config/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/show-config/*.html" ]
