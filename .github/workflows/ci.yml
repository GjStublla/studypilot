# Phase 0: secret scan only. Later UEP phases add test/build jobs to this file;
# do not treat a green secret-scan-only workflow as "full CI is done."
#
# Fail-closed: Gitleaks scans the full git history (`fetch-depth: 0`).
# A credential that was committed and later deleted still fails the job.
# That is the point of this gate.
#
# Current expected failure — do not "fix" it by allowlisting:
#   rule private-key, path backend/service-account.json, commit 1e0f6bb
# A human must rotate that Google key if it was ever valid, then approve a
# history rewrite. Until then this job stays red. See SECURITY.md.
#
# Not using gitleaks/gitleaks-action: that action requires a paid
# GITLEAKS_LICENSE on organization-owned repositories and can skip scans.
# This job downloads the MIT-licensed binary, verifies the upstream sha256,
# and runs `gitleaks git --redact` so findings are not written in cleartext.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bindir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${bindir}"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${bindir}" gitleaks
          echo "${bindir}" >> "${GITHUB_PATH}"
          "${bindir}/gitleaks" version

      - name: Scan git history for credentials
        run: gitleaks git --redact --no-banner --config .gitleaks.toml
