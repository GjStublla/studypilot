# The history secret scan remains a deliberately visible gate until the
# previously committed service-account credential is rotated and any approved
# history rewrite is complete. The other jobs are non-secret reproducibility
# checks and do not turn a skipped hosted check into a pass.
#
# Fail-closed: Gitleaks scans the full git history (`fetch-depth: 0`).
# A credential that was committed and later deleted still fails the job.
# That is the point of this gate.
#
# Current expected failure — do not "fix" it by allowlisting:
#   rule private-key, path backend/service-account.json, commit 1e0f6bb
# A human must rotate that Google key if it was ever valid, then approve a
# history rewrite. Until then this job stays red. See SECURITY.md.
#
# Not using gitleaks/gitleaks-action: that action requires a paid
# GITLEAKS_LICENSE on organization-owned repositories and can skip scans.
# This job downloads the MIT-licensed binary, verifies the upstream sha256,
# and runs `gitleaks git --redact` so findings are not written in cleartext.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          bindir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${bindir}"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${bindir}" gitleaks
          echo "${bindir}" >> "${GITHUB_PATH}"
          "${bindir}/gitleaks" version

      - name: Scan git history for credentials
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Run Deno function tests
        run: npm run test:deno

      - name: Validate pilot results template
        run: |
          node --test scripts/validate-pilot-results.test.mjs
          npm run validate:pilot
          npm run summarize:pilot

      - name: Validate public claims
        run: |
          node --test scripts/validate-claims.test.mjs
          npm run validate:claims
          npm run validate:pitch

      - name: Validate submission artifacts
        run: |
          node --test scripts/validate-submission-package.test.mjs
          npm run validate:submission

      - name: Build and scan public bundle
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.ci-placeholder-key
        run: |
          npm run build
          npm run verify:built-env

  web-e2e:
    name: Web Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a085f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run web Playwright suite
        run: npm run test:e2e -- --reporter=line

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

  supabase-tests:
    name: Supabase pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Run database tests
        run: npx supabase test db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  hosted-function-allowlist:
    name: Hosted function allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never expose the management-token check to arbitrary branches or pull
    # requests. The job is scheduled only where repository administrators have
    # enabled branch protection; the step below reports a visible skip when
    # the protected environment has not supplied both secrets yet.
    if: github.ref_protected
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify hosted functions when protected secrets exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Hosted function allowlist SKIPPED: protected Supabase secrets are not configured."
            exit 0
          fi
          npm run verify:functions
