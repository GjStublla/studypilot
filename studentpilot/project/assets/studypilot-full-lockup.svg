<svg width="720" height="210" viewBox="0 0 720 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StudyPilot logo</title>
  <desc id="desc">StudyPilot wordmark with AI orb, browser window, open book, and pilot arrow icon.</desc>

  <defs>
    <linearGradient id="orbGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39D7FF"></stop>
      <stop offset="42%" stop-color="#5C6CFF"></stop>
      <stop offset="72%" stop-color="#A855F7"></stop>
      <stop offset="100%" stop-color="#FF4FD8"></stop>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BB8FF"></stop>
      <stop offset="50%" stop-color="#7C5CFF"></stop>
      <stop offset="100%" stop-color="#F04CFF"></stop>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"></stop>
      <stop offset="42%" stop-color="#74D7FF" stop-opacity="0.55"></stop>
      <stop offset="70%" stop-color="#875CFF" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#FF4FD8" stop-opacity="0.12"></stop>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(24 18) scale(0.95)">

  <g id="studypilot-mark" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 72V38c0-9.9 8.1-18 18-18h96c9.9 0 18 8.1 18 18v34" fill="none" stroke="#404657" stroke-width="4"></path>
    <path d="M34 48h132" fill="none" stroke="#242A38" stroke-width="3"></path>
    <circle cx="52" cy="34" r="4.5" fill="#51596B"></circle>
    <circle cx="66" cy="34" r="4.5" fill="#51596B" opacity="0.82"></circle>
    <circle cx="80" cy="34" r="4.5" fill="#51596B" opacity="0.64"></circle>

    <circle cx="100" cy="92" r="44" fill="url(#orbGradient)" filter="url(#softGlow)"></circle>
    <circle cx="100" cy="92" r="44" fill="url(#orbGlow)"></circle>
    <path d="M100 61l19 58-19-13-19 13 19-58z" fill="none" stroke="#FFFFFF" stroke-width="4"></path>
    <path d="M100 68v38" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"></path>

    <path d="M100 155c-23-16-49-22-86-22" fill="none" stroke="url(#lineGradient)" stroke-width="4"></path>
    <path d="M100 155c23-16 49-22 86-22" fill="none" stroke="url(#lineGradient)" stroke-width="4"></path>
    <path d="M100 155c-19-10-43-14-78-14" fill="none" stroke="#8B8CFF" stroke-width="2.8" opacity="0.85"></path>
    <path d="M100 155c19-10 43-14 78-14" fill="none" stroke="#F04CFF" stroke-width="2.8" opacity="0.85"></path>

    <path d="M100 9l4 11 11 4-11 4-4 11-4-11-11-4 11-4 4-11z" fill="#FFFFFF"></path>
    <path d="M100 0v5M100 43v5" stroke="#93C5FD" stroke-width="2" opacity="0.75"></path>
  </g>

  </g>
  <text x="235" y="104" fill="#F8FAFC" font-size="62" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-weight="650" letter-spacing="-2.2">StudyPilot</text>
  <circle cx="575" cy="55" r="6" fill="url(#orbGradient)"></circle>
  <text x="239" y="148" fill="#A6ADBB" font-size="14" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-weight="500" letter-spacing="8">AI-POWERED STUDY ASSISTANT</text>
</svg>