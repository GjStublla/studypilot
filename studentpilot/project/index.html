<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>StudyPilot — An AI coach that helps you improve your work</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Geist', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          serif: ['"Instrument Serif"', 'ui-serif', 'Georgia', 'serif'],
        },
      },
    },
  };
</script>

<style>
  :root {
    /* Official brand tokens */
    --sp-cyan:   #39D7FF;
    --sp-blue:   #5BB8FF;
    --sp-violet: #7C5CFF;
    --sp-purple: #A855F7;
    --sp-pink:   #FF4FD8;

    /* Accent system (mapped to brand) */
    --accent:    #7C5CFF;
    --accent-2:  #39D7FF;
    --accent-3:  #FF4FD8;
    --accent-soft: color-mix(in oklab, var(--accent) 14%, #03050A);
    --accent-ink: #C4B5FF;

    /* Brand surfaces */
    --bg:        #03050A;
    --surface:   #080B12;
    --surface-2: #0D111C;
    --surface-3: #121726;
    --ink:       #F8FAFC;
    --ink-2:     #E2E8F0;
    --ink-3:     #A6ADBB;
    --ink-4:     #7A8290;
    --ink-5:     #4E5562;
    --line:      rgba(148, 163, 184, 0.14);
    --line-2:    rgba(148, 163, 184, 0.08);
    --line-strong: rgba(148, 163, 184, 0.28);
  }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-feature-settings: "ss01", "ss02", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background:
      radial-gradient(900px 700px at 8% -100px, color-mix(in oklab, var(--sp-violet) 22%, transparent), transparent 65%),
      radial-gradient(700px 500px at 100% 200px, color-mix(in oklab, var(--sp-cyan) 10%, transparent), transparent 60%),
      var(--bg);
  }
  ::selection { background: color-mix(in oklab, var(--accent) 50%, transparent); color: white; }

  html { scroll-behavior: smooth; }

  /* Faint dot grain */
  .grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 3px 3px; opacity: .55;
  }

  /* Hairline */
  .hairline { box-shadow: inset 0 0 0 1px var(--line); }

  .doc p { margin-bottom: 0.75rem; line-height: 1.65; }
  .doc-h { font-family: 'Instrument Serif', Georgia, serif; }

  @keyframes pulseDot { 0%,100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }
  .pulse-dot { animation: pulseDot 1.4s ease-in-out infinite; }
  .pulse-dot:nth-child(2){ animation-delay: 0.2s; }
  .pulse-dot:nth-child(3){ animation-delay: 0.4s; }

  @keyframes wave { 0%,100% { height: 4px; } 50% { height: 16px; } }
  .wave-bar { animation: wave 1.1s ease-in-out infinite; }

  .nav-link { color: var(--ink-3); }
  .nav-link:hover { color: var(--ink); }

  /* Buttons */
  .btn-primary {
    position: relative;
    background: #fafafa;
    color: #0a0a0a;
    border-radius: 999px;
    padding: 0.6rem 1.05rem;
    font-weight: 500;
    font-size: 0.875rem;
    letter-spacing: -0.005em;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 6px 24px -8px rgba(0,0,0,0.6),
      0 0 30px -8px color-mix(in oklab, var(--accent) 35%, transparent);
    transition: transform .15s ease, box-shadow .25s ease;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.1) inset,
      0 10px 30px -8px rgba(0,0,0,0.7),
      0 0 40px -6px color-mix(in oklab, var(--accent) 55%, transparent);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 0.6rem 1.05rem;
    font-weight: 500;
    font-size: 0.875rem;
    backdrop-filter: blur(6px);
    transition: background .15s ease, border-color .15s ease;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.22); }

  /* Glassmorphism card */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)) var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 40px 80px -30px rgba(0,0,0,0.7);
  }
  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
    border: 1px solid var(--line);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
  }
  .card-raised {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  .accent-ring {
    background: color-mix(in oklab, var(--accent) 12%, transparent);
    color: var(--accent-ink);
    border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
  }

  .sep { border-color: var(--line); }

  /* Gradient text — reserved for hero only */
  .grad-text {
    background: linear-gradient(180deg, #ffffff 0%, #d4d4d8 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .grad-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 60%, transparent), transparent);
  }
  /* Section number — small custom divider mark */
  .section-mark {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink-4);
  }
  .rule {
    height: 1px;
    background: linear-gradient(90deg, var(--line-strong), transparent);
  }

  /* ——— ORB ——— */
  @keyframes orbSpin   { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes orbBreath { 0%,100% { transform: scale(1); filter: blur(0); } 50% { transform: scale(1.03); filter: blur(0.5px); } }
  @keyframes orbHalo   { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .85; transform: scale(1.08); } }
  @keyframes orbRipple { 0% { transform: scale(.85); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }

  .orb { animation: orbBreath 6s ease-in-out infinite; }
  /* Orb spinning conic — matches brand orb gradient (cyan → blue → violet → pink) */
  .orb-conic {
    background:
      conic-gradient(from 0deg,
        #39D7FF,
        #5C6CFF,
        #A855F7,
        #FF4FD8,
        #39D7FF);
    animation: orbSpin 14s linear infinite;
    filter: blur(8px);
  }
  .orb-halo {
    animation: orbHalo 5s ease-in-out infinite;
  }
  .orb-ripple {
    animation: orbRipple 3.2s ease-out infinite;
  }

  /* Conic glow */
  .conic-glow::before {
    content: "";
    position: absolute; inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(from 90deg at 50% 50%,
      color-mix(in oklab, var(--accent) 70%, transparent),
      color-mix(in oklab, var(--accent-2) 70%, transparent),
      color-mix(in oklab, var(--accent-3) 70%, transparent),
      color-mix(in oklab, var(--accent) 70%, transparent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
    opacity: .6;
  }

  /* Subtle inner ring used on hero CTA wrapper */
  .ring-glow {
    box-shadow:
      0 0 0 1px var(--line),
      0 0 60px -20px color-mix(in oklab, var(--accent) 70%, transparent);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<!-- lucide -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="product-mockup.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

</html>
